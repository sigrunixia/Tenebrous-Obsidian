name: Dependabot auto-merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dart-sass
        env:
          SASS_VERSION: "1.102.0"
        run: |
          curl -fsSL "https://github.com/sass/dart-sass/releases/download/${SASS_VERSION}/dart-sass-${SASS_VERSION}-linux-x64.tar.gz" -o dart-sass.tar.gz
          tar -xzf dart-sass.tar.gz
          echo "$PWD/dart-sass" >> "$GITHUB_PATH"

      - name: Build theme.css
        run: ./build.sh

      - name: Verify theme.css is up to date
        run: |
          if ! git diff --exit-code theme.css; then
            echo "::error::theme.css is out of date -- run ./build.sh and commit the result."
            exit 1
          fi

  auto-merge:
    needs: build
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Auto-merge patch/minor bumps
        if: ${{ steps.metadata.outputs.update-type != 'version-update:semver-major' }}
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL"
