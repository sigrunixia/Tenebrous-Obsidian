name: Auto-tag on version bump

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      bumped: ${{ steps.check.outputs.bumped }}
    steps:
      - uses: actions/checkout@v7

      - name: Check for a version bump
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(jq -r .version manifest.json)"
          latest="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')"
          latest="${latest#v}"

          if [ -n "$latest" ] && \
             [ "$(printf '%s\n%s\n' "$version" "$latest" | sort -V | tail -1)" != "$version" ]; then
            echo "manifest.json ($version) is not newer than the latest release ($latest); nothing to do."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$version" = "$latest" ]; then
            echo "manifest.json ($version) already released; nothing to do."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          min_app="$(jq -r .minAppVersion manifest.json)"
          if [ "$(jq -r --arg v "$version" '.[$v] // ""' versions.json)" = "" ]; then
            echo "versions.json has no entry for $version; adding \"$version\": \"$min_app\"."
            tmp="$(mktemp)"
            jq --arg v "$version" --arg m "$min_app" '.[$v] = $m' versions.json > "$tmp"
            mv "$tmp" versions.json

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add versions.json
            git commit -m "Add versions.json entry for $version"
            git push origin HEAD:main
          fi

          echo "bumped=true" >> "$GITHUB_OUTPUT"

  release:
    needs: check
    if: needs.check.outputs.bumped == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
