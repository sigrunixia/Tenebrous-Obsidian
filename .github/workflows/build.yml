name: Build theme.css and publish.js

on:
  push:
    paths:
      - "src/**"
      - "build-publish.sh"
      - "tsconfig.json"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "src/**"
      - "build-publish.sh"
      - "tsconfig.json"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dart-sass
        env:
          SASS_VERSION: "1.102.0"
        run: |
          curl -fsSL "https://github.com/sass/dart-sass/releases/download/${SASS_VERSION}/dart-sass-${SASS_VERSION}-linux-x64.tar.gz" -o dart-sass.tar.gz
          tar -xzf dart-sass.tar.gz
          echo "$PWD/dart-sass" >> "$GITHUB_PATH"

      - name: Build theme.css
        run: sass --no-source-map src/main.scss theme.css

      - name: Verify theme.css is up to date
        run: |
          if ! git diff --exit-code theme.css; then
            echo "::error::theme.css is out of date -- build theme.css and commit the result."
            exit 1
          fi

      - name: Build publish.css
        run: sass --no-source-map src/main-publish.scss publish.css

      - name: Verify publish.css is up to date
        run: |
          if ! git diff --exit-code publish.css; then
            echo "::error::publish.css is out of date -- build publish.css and commit the result."
            exit 1
          fi

      - name: Build snippets
        run: |
          sass --no-source-map src/snippets/main-contact-snippet.scss snippets/contact-preview.css
          sass --no-source-map src/snippets/main-landing-snippet.scss snippets/landing-preview.css
          sass --no-source-map src/snippets/main-trips-snippet.scss snippets/trips-preview.css

      - name: Verify snippets are up to date
        run: |
          if ! git diff --exit-code snippets; then
            echo "::error::A snippet is out of date -- build the snippets and commit the result."
            exit 1
          fi

      - name: Install esbuild and TypeScript
        env:
          ESBUILD_VERSION: "0.28.2"
          TSC_VERSION: "7.0.2"
        run: |
          mkdir -p "$HOME/tools/esbuild" "$HOME/tools/tsc"
          curl -fsSL "https://registry.npmjs.org/@esbuild/linux-x64/-/linux-x64-${ESBUILD_VERSION}.tgz" | tar -xz -C "$HOME/tools/esbuild" --strip-components=1
          curl -fsSL "https://registry.npmjs.org/@typescript/typescript-linux-x64/-/typescript-linux-x64-${TSC_VERSION}.tgz" | tar -xz -C "$HOME/tools/tsc" --strip-components=1
          echo "$HOME/tools/esbuild/bin" >> "$GITHUB_PATH"
          echo "$HOME/tools/tsc/lib" >> "$GITHUB_PATH"

      - name: Build publish.js
        run: ./build-publish.sh

      - name: Verify publish.js is up to date
        run: |
          if ! git diff --exit-code publish.js; then
            echo "::error::publish.js is out of date -- run build-publish.sh and commit the result."
            exit 1
          fi
